<!DOCTYPE html>
<head>
    <title>
        Social Links Profile
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bgbox">
        <img src="assets/avatar-jessica.jpeg"
        alt="avatar"
        class="avatar">
        <div class="name">
            Jessica Randall
        </div>
        <div class="loc">
            London, United Kingdom
        </div>
        <div class="info">
            "Front-end developer and avid reader."
        </div>
        <button class="Github" >
            GitHub
        </button>
        <br>
        <button class="FrontendMentor">
            Frontend Mentor
        </button>
        <br>
        <button class="LinkedIn">
            LinkedIn
        </button>
        <br>
        <button class="Twitter">
            Twitter
        </button>
        <br>
        <button class="Instagram">
            Instagram
        </button>
    </div>
</body>
</html>
